custom_proxy_group=📲 电报消息`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=🐱 Github`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=🌐 社交媒体`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=🎬 流媒体`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=🎮 游戏平台`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=💰 金融服务`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=☁️ 云服务`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=🐟 漏网之鱼`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

; ============================================================
; GLOBAL
; ============================================================

custom_proxy_group=GLOBAL`select`[]🚀 节点选择`[]🔒 国内服务`[]💬 AI 服务`[]📹 油管视频`[]🔍 谷歌服务`[]📲 电报消息`[]🐱 Github`[]🌐 社交媒体`[]🎬 流媒体`[]🎮 游戏平台`[]💰 金融服务`[]☁️ 云服务`[]🐟 漏网之鱼`[]DIRECT`[]REJECT

; ============================================================
; 分流规则
; ============================================================

; ---------- 私有网络 / 本地地址 ----------
ruleset=🔒 国内服务,[]GEOIP,private,no-resolve
ruleset=🔒 国内服务,[]DOMAIN-SUFFIX,local
ruleset=🔒 国内服务,[]IP-CIDR,192.168.0.0/16,no-resolve
ruleset=🔒 国内服务,[]IP-CIDR,10.0.0.0/8,no-resolve
ruleset=🔒 国内服务,[]IP-CIDR,172.16.0.0/12,no-resolve
ruleset=🔒 国内服务,[]IP-CIDR,127.0.0.0/8,no-resolve
ruleset=🔒 国内服务,[]IP-CIDR,169.254.0.0/16,no-resolve
ruleset=🔒 国内服务,[]IP-CIDR6,fe80::/10,no-resolve

; ---------- UDP 443 ----------
ruleset=REJECT,[]AND,((NETWORK,udp),(DST-PORT,443))

; ---------- AI ----------
ruleset=💬 AI 服务,clash-domain:https://cdn.jsdelivr.net/gh/MetaCubeX/meta-rules-dat@meta/geo/geosite/category-ai-!cn.mrs,86400
ruleset=💬 AI 服务,[]DOMAIN-SUFFIX,x.ai
ruleset=💬 AI 服务,[]DOMAIN-SUFFIX,grok.x.ai
ruleset=💬 AI 服务,[]DOMAIN-KEYWORD,grok

