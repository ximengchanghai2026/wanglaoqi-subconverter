; ============================================================
; wanglaoqi.ini
; EdgeTunnel + subconverter v0.9.x
; 端口组 + 业务策略组 + Mihomo Rule Providers
;
; 节点来源：
;   由订阅转换请求传入，本文件不保存任何节点。
;
; 节点名称示例：
;   网段随机 | 104.17.83.194:8443-8443 01
;
; 端口组通过节点备注中的：
;   -443 01
;   -8443 01
;   -2053 01
;   ...
; 进行匹配。
; ============================================================

[custom]

; ============================================================
; 基础生成器
; ============================================================

enable_rule_generator=true
overwrite_original_rules=true

; ============================================================
; 所有节点
; ============================================================

custom_proxy_group=所有节点`select`.*

; ============================================================
; 13 个端口组
;
; url-test：
;   每 300 秒测速
;   超时 5 秒
;   延迟容差 50ms
;
; 正则只匹配节点备注末尾的：
;   -端口 序号
;
; 例如：
;   xxx:8443-8443 01
; ============================================================

custom_proxy_group=443端口组`url-test`.*-443 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2053端口组`url-test`.*-2053 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2095端口组`url-test`.*-2095 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2087端口组`url-test`.*-2087 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=8443端口组`url-test`.*-8443 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2096端口组`url-test`.*-2096 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2083端口组`url-test`.*-2083 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=8080端口组`url-test`.*-8080 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=8880端口组`url-test`.*-8880 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2052端口组`url-test`.*-2052 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2086端口组`url-test`.*-2086 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=2082端口组`url-test`.*-2082 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50

custom_proxy_group=80端口组`url-test`.*-80 [0-9]+$`http://www.gstatic.com/generate_204`300,5,50


; ============================================================
; 🚀 节点选择
; ============================================================

custom_proxy_group=🚀 节点选择`select`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT


