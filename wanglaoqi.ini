[custom]

; ============================================================
; wanglaoqi.ini
; 端口组 + 业务策略组 + 完整分流规则
; 基于历史 wanglaoqi-final.ini / wanglaoqi-v2.ini 逐项合并整理
;
; 节点命名要求：
;   xxx-443 01
;   xxx-443 02
;   xxx-2053 01
;   ...
;
; 端口组共 13 个：
;   443 / 2053 / 2095 / 2087 / 8443 / 2096 / 2083
;   8080 / 8880 / 2052 / 2086 / 2082 / 80
;
; 端口组使用 url-test 自动测速；
; 业务策略组可以直接选择端口组，也可以选择总节点组。
; ============================================================

enable_rule_generator=true
overwrite_original_rules=true

; ============================================================
; 所有节点
; ============================================================

custom_proxy_group=所有节点`select`.*

; ============================================================
; 13 个端口组
; 统一采用历史 v2 中更稳妥的 “-端口 + 空格 + 两位编号” 匹配方式
; ============================================================

custom_proxy_group=443端口组`url-test`.*-443[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2053端口组`url-test`.*-2053[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2095端口组`url-test`.*-2095[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2087端口组`url-test`.*-2087[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=8443端口组`url-test`.*-8443[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2096端口组`url-test`.*-2096[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2083端口组`url-test`.*-2083[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=8080端口组`url-test`.*-8080[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=8880端口组`url-test`.*-8880[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2052端口组`url-test`.*-2052[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2086端口组`url-test`.*-2086[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=2082端口组`url-test`.*-2082[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50
custom_proxy_group=80端口组`url-test`.*-80[ ]\d{2}$`https://www.gstatic.com/generate_204`300,,50

; ============================================================
; 总节点选择
; ============================================================

custom_proxy_group=🚀 节点选择`select`[]DIRECT`[]REJECT`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点

; ============================================================
; 业务策略组
; ============================================================

custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]REJECT

custom_proxy_group=💬 AI 服务`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

custom_proxy_group=📹 油管视频`select`[]🚀 节点选择`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]DIRECT`[]REJECT

