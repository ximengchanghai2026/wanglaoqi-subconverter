; 🔒 国内服务
; ============================================================

custom_proxy_group=🔒 国内服务`select`[]DIRECT`[]443端口组`[]2053端口组`[]2095端口组`[]2087端口组`[]8443端口组`[]2096端口组`[]2083端口组`[]8080端口组`[]8880端口组`[]2052端口组`[]2086端口组`[]2082端口组`[]80端口组`[]所有节点`[]REJECT


